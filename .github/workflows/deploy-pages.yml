name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - uses: actions/configure-pages@v5
      - name: Build static projects
        run: |
          mkdir -p dist
          cp index.html dist/index.html
          for project in cosmetology agro dentistry florist furniture car-import; do
            cd "$project"
            npm ci
            NEXT_PUBLIC_BASE_PATH="/${{ github.event.repository.name }}/$project" npm run build
            cd ..
            cp -R "$project/out" "dist/$project"
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
